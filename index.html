<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda do Chefe</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar / Painel Esquerdo -->
      <aside class="sidebar">
        <div class="logo">
          <h1>Agenda<span>PRO</span></h1>
          <p>Painel de Apresentações</p>
        </div>

        <button class="btn-primary" id="btn-new-meeting">
          + Nova Reunião
        </button>

        <div class="upcoming-meetings">
          <h2>Próximos Compromissos</h2>
          <div id="meetings-list" class="meetings-list">
            <!-- As reuniões serão injetadas aqui -->
          </div>
        </div>
      </aside>

      <!-- Conteúdo Principal / Calendário -->
      <main class="main-content">
        <header class="calendar-header">
          <div class="month-navigation">
            <button id="btn-prev-month" class="nav-btn">&lt;</button>
            <h2 id="current-month-display">Agosto 2026</h2>
            <button id="btn-next-month" class="nav-btn">&gt;</button>
          </div>
          <button id="btn-today" class="btn-secondary">Hoje</button>
        </header>

        <div class="calendar-container">
          <div class="weekdays">
            <div>Dom</div>
            <div>Seg</div>
            <div>Ter</div>
            <div>Qua</div>
            <div>Qui</div>
            <div>Sex</div>
            <div>Sáb</div>
          </div>
          <div id="calendar-grid" class="calendar-grid">
            <!-- Os dias do calendário serão injetados aqui -->
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Nova Reunião -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Agendar Nova Apresentação</h2>
          <button id="btn-close-modal" class="close-btn">&times;</button>
        </div>
        <form id="form-new-meeting">
          <div class="form-group">
            <label for="client-name">Qual o seu nome? <span style="color: var(--accent); font-size: 0.8em;">*</span></label>
            <input type="text" id="client-name" required placeholder="Seu nome" />
          </div>
          <div class="form-group">
            <label for="client-email">Qual o seu e-mail?</label>
            <input type="email" id="client-email" placeholder="seuemail@exemplo.com" />
          </div>
          <div class="form-group">
            <label for="company-info">Qual o nome e ramo da sua empresa?</label>
            <input type="text" id="company-info" placeholder="Ex: Acme Corp - Tecnologia (opcional)" />
          </div>
          <div class="form-group">
            <label for="market-operation">Como ela atua hoje no mercado?</label>
            <textarea id="market-operation" rows="2" placeholder="Descreva a atuação..."></textarea>
          </div>
          <div class="form-group">
            <label for="biggest-difficulty">Qual sua maior dificuldade hoje?</label>
            <textarea id="biggest-difficulty" rows="2" placeholder="Descreva a dificuldade..."></textarea>
          </div>
          <div class="form-group">
            <label for="problem-to-solve">Qual problema você deseja resolver?</label>
            <textarea id="problem-to-solve" rows="2" placeholder="Descreva o problema..."></textarea>
          </div>
          <div class="form-group">
            <label for="how-can-we-help">Como podemos lhe ajudar?</label>
            <textarea id="how-can-we-help" rows="2" placeholder="O que você espera de nós..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="meeting-date">Data</label>
              <input type="date" id="meeting-date" required />
            </div>
            <div class="form-group">
              <label for="meeting-time">Horário</label>
              <input type="time" id="meeting-time" required />
            </div>
          </div>
          <div class="form-actions">
            <button type="button" id="btn-cancel-meeting" class="btn-secondary">Cancelar</button>
            <button type="submit" class="btn-primary">Salvar Agendamento</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Detalhes e Notificação -->
    <div id="modal-details" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>Detalhes da Apresentação</h2>
          <button id="btn-close-details" class="close-btn">&times;</button>
        </div>
        <div class="details-content" id="details-content">
          <!-- Detalhes serão injetados aqui -->
        </div>
        <div class="notification-actions">
          <h3>Notificar Chefe</h3>
          <p>O agendamento foi salvo. Deseja avisá-lo agora?</p>
          <div class="action-buttons">
            <a href="#" id="btn-notify-whatsapp" target="_blank" class="btn-whatsapp">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
              WhatsApp
            </a>
            <a href="#" id="btn-notify-email" class="btn-email">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              Email
            </a>
          </div>
        </div>
        <div class="form-actions" style="margin-top: 20px;">
          <button id="btn-delete-meeting" class="btn-danger">Excluir Agendamento</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
